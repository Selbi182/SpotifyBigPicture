buildscript {
    ext {
        springVersion = '4.1.2'
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:$springVersion")
    }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

jar {
    archiveBaseName.set('SpotifyBigPicture')
    archiveFileName = "${archiveBaseName}"
}

springBoot {
    mainClass.set('spotify.SpotifyBigPicture')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += "-parameters"
}

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://mymavenrepo.com/repo/FpgB1Mi6I9ud1Gd3tX0r/'
    }
}

dependencies {
    implementation 'se.michaelthelin.spotify:spotify-web-api-java:11.0.0-RC2'

    implementation 'spotify:spotify-dependencies:1.15.0-pre1'
    implementation 'de.selbi:color-fetch:1.4.0'
    implementation "org.springframework.boot:spring-boot-starter-web:$springVersion"
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'com.github.albfernandez:juniversalchardet:2.5.2'

    testImplementation "org.springframework.boot:spring-boot-starter-test:$springVersion"
}

test {
    useJUnitPlatform()
}